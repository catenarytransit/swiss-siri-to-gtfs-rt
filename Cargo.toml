[package]
name = "swiss-siri-to-gtfs-rt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
chrono-tz = "0.10.4"
csv = "1.4.0"
dashmap = "6.2.1"
flate2 = "1.1.9"
futures-util = "0.3.32"
gtfs-realtime = "0.2.0"
gtfs-structures = "0.48.2"
prost = "0.14.4"
quick-xml = { version = "0.40", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.52.3", features = ["full"] }
warp = "0.3"
zip = "8.6.0"
